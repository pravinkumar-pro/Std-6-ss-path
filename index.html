<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>ભૂમિસ્વરૂપો અને જીવન — ઈ-પાઠ</title>
<style>
:root{
  --bg1:#eef7f4; --bg2:#e6f0fb;
  --primary:#0f766e; --primary-dark:#115e59;
  --accent:#f59e0b;
  --card:#ffffff; --text:#12312e; --muted:#5b7472;
  --ok:#15803d; --bad:#b91c1c;
  --radius:18px;
  --shadow:0 6px 20px rgba(15,118,110,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Noto Sans Gujarati','Shruti','Segoe UI',system-ui,-apple-system,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text); line-height:1.8; font-size:17px; min-height:100vh;
}
header{
  background:linear-gradient(120deg,#0f766e,#0d9488 55%,#14b8a6);
  color:#fff; padding:20px 16px 16px; text-align:center;
  box-shadow:0 4px 18px rgba(15,118,110,.28);
}
header h1{margin:0;font-size:clamp(19px,3.4vw,28px);letter-spacing:.3px}
header p{margin:6px 0 0;opacity:.92;font-size:clamp(12px,2.2vw,15px)}
nav{
  display:flex; gap:10px; overflow-x:auto; padding:12px 14px;
  background:rgba(255,255,255,.82); backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:50;
  border-bottom:1px solid #d7e8e5; scrollbar-width:thin;
}
nav::-webkit-scrollbar{height:6px}
nav::-webkit-scrollbar-thumb{background:#b9ddd8;border-radius:99px}
.chip{
  flex:0 0 auto; padding:10px 16px; border-radius:999px;
  border:2px solid #cfe6e3; background:#fff; color:var(--primary);
  font-weight:700; font-size:15px; cursor:pointer; min-height:46px;
  transition:.2s; white-space:nowrap; font-family:inherit;
}
.chip:hover{background:#e6f7f4; transform:translateY(-1px)}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);
  box-shadow:0 4px 14px rgba(15,118,110,.32)}
main{max-width:1020px;margin:0 auto;padding:20px 14px 70px}
.lessonCard{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:clamp(16px,3vw,24px); margin-bottom:20px;
  border:1px solid #e2efed; animation:fade .35s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lessonCard h2{margin:0 0 4px;font-size:clamp(18px,3.2vw,24px);color:var(--primary-dark)}
.lessonCard .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{
  font-family:inherit;font-size:16px;font-weight:700;border-radius:14px;
  padding:12px 18px;cursor:pointer;border:none;min-height:50px;transition:.2s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(15,118,110,.28)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.secondary{background:#e6f7f4;color:var(--primary-dark);border:2px solid #bfe3dd}
.btn.secondary:hover{background:#d3efea}
.btn.accent{background:var(--accent);color:#3b2400;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.btn.accent:hover{background:#d97706;color:#fff}
.btn.active{outline:3px solid #fbbf24;outline-offset:2px}
.panel{display:none;animation:fade .3s}
.panel.show{display:block}
.planGrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.planGrid{grid-template-columns:1fr 1fr}}
.planItem{background:#f6fbfa;border-left:5px solid var(--primary);border-radius:12px;padding:12px 15px}
.planItem h4{margin:0 0 6px;font-size:15px;color:var(--primary-dark)}
.planItem p{margin:0;font-size:15px}
.planItem.remedial{border-left-color:#f59e0b;background:#fffdf5}
.planItem.remedial h4{color:#b45309}
.planItem.reeval{border-left-color:#8b5cf6;background:#faf7ff}
.planItem.reeval h4{color:#6d28d9}
.content h3{
  color:var(--primary-dark);font-size:clamp(16px,2.6vw,19px);
  margin:22px 0 8px;padding-bottom:6px;border-bottom:2px dashed #cfe6e3;
}
.content h3:first-child{margin-top:0}
.content p{margin:10px 0}
.content ul,.content ol{padding-left:22px;margin:10px 0}
.content li{margin:6px 0}
.content b{color:var(--primary-dark)}
.hl{
  background:linear-gradient(135deg,#fff8e6,#fef3c7);
  border-left:5px solid var(--accent); border-radius:12px;
  padding:12px 15px; margin:14px 0; font-size:16px;
}
.note{
  background:#e8f7f4;border-left:5px solid var(--primary);
  border-radius:12px;padding:12px 15px;margin:14px 0;
}
table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
table.tbl th,table.tbl td{border:1px solid #cfe6e3;padding:9px 11px;text-align:left}
table.tbl th{background:#e6f7f4;color:var(--primary-dark)}
/* ---------- MEDIA ---------- */
.mediaSection{margin-top:8px}
.mediaSection h3{margin-top:18px}
.imgGrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.imgGrid{grid-template-columns:1fr 1fr}}
.imgCard{margin:0;background:#f6fbfa;border-radius:14px;overflow:hidden;border:1px solid #d7e8e5}
.imgCard img{width:100%;height:auto;display:block;aspect-ratio:16/10;object-fit:cover}
.imgPlaceholder{
  aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;background:linear-gradient(135deg,#e6f7f4,#d3efea);color:var(--primary-dark);
  border:2px dashed #8ecfc6;margin:8px;border-radius:10px;
}
.phIcon{font-size:38px;line-height:1}
.phText{font-weight:700;font-size:15px}
.phHint{font-size:12px;color:var(--muted);text-align:center;padding:0 10px}
.imgCard figcaption{padding:10px 14px;font-size:14.5px;color:var(--text);background:#fff}
.vidGrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.vidGrid{grid-template-columns:1fr 1fr}}
.vidCard{margin:0;background:#f6fbfa;border-radius:14px;overflow:hidden;border:1px solid #d7e8e5}
.vidFrame{position:relative;padding-top:56.25%}
.vidFrame iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.vidCard video{width:100%;display:block;background:#000}
.vidPlaceholder{
  aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:linear-gradient(135deg,#fff8e6,#fef3c7);color:#92400e;
  border:2px dashed #f5cf7a;margin:8px;border-radius:10px;
}
.vidCard figcaption{padding:10px 14px;font-size:14.5px;color:var(--text);background:#fff}
/* ---------- QUIZ ---------- */
.quizBox{
  margin-top:6px;background:#fffdf5;border:2px dashed #f5cf7a;
  border-radius:16px;padding:clamp(12px,2.5vw,18px);
}
.quizTitle{font-weight:800;color:#b45309;font-size:17px;margin:0 0 14px}
.qItem{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #efe3c6}
.qText{font-weight:700;margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:flex-start}
.qNum{
  display:inline-flex;width:27px;height:27px;min-width:27px;border-radius:50%;
  background:var(--primary);color:#fff;align-items:center;justify-content:center;
  font-size:14px;margin-top:2px;
}
.opts{display:grid;gap:8px}
.opt{
  display:flex;align-items:center;gap:11px;padding:11px 13px;
  border:2px solid #e2e8e7;border-radius:12px;cursor:pointer;
  transition:.15s;background:#fff;font-size:16px;min-height:48px;
}
.opt:hover{border-color:#8ecfc6;background:#f2fbf9}
.opt input{accent-color:var(--primary);width:20px;height:20px;flex:0 0 auto;cursor:pointer}
.opt.correct{border-color:var(--ok);background:#e9f9ee}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.feedback{margin:9px 0 0;font-size:14.5px;font-weight:700;display:none}
.feedback.ok,.feedback.bad,.feedback.warn{display:block}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.feedback.warn{color:#b45309}
.scoreCard{
  background:linear-gradient(135deg,#e6f7f4,#d3efea);
  border-radius:14px;padding:16px;text-align:center;
  font-size:18px;font-weight:800;color:var(--primary-dark);margin-top:14px;
}
#printArea{display:none}
@media print{
  header, nav, main{display:none !important;}
  body{background:#fff;}
  #printArea{display:block !important;}
  .pHead{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:16px;}
  .pHead h1{font-size:18pt;margin:0 0 4px;}
  .pHead p{margin:2px 0;font-size:10.5pt;}
  .pInfo{margin-top:10px !important;font-size:11pt !important;}
  .pList{padding-left:20px;}
  .pList li{margin-bottom:11px;font-size:11pt;page-break-inside:avoid;}
  .pq{font-weight:700;margin-bottom:4px;}
  .popts{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:10.5pt;}
  .pAns{margin-top:18px;padding:10px;border:1.5px dashed #000;font-size:11pt;font-weight:700;}
  .pPlan h3{font-size:13pt;margin:14px 0 4px;border-bottom:1px solid #999;}
  .pPlan p{margin:2px 0 8px;font-size:11pt;}
}
</style>
</head>

{

  <h3>પૃથ્વીની સપાટી એકસરખી નથી</h3>
  <p>પૃથ્વી પર ક્યાંક ઊંચા પર્વતો, ક્યાંક વિશાળ સપાટ મેદાનો અને ક્યાંક ઉપસેલા ઉચ્ચપ્રદેશો જોવા મળે છે. પૃથ્વીની સપાટી પરની આ ભૌતિક લાક્ષણિકતાઓને <b>ભૂમિદશ્ય (Landscape)</b> કહેવામાં આવે છે.</p>
  <div class="hl">🔑 <b>ભૂમિસ્વરૂપ (Landform):</b> પૃથ્વીની સપાટી પરનું કુદરતી સ્વરૂપ — જેમ કે પર્વત, ઉચ્ચપ્રદેશ અને મેદાન.</div>
  <p>ભૂમિસ્વરૂપો <b>લાખો વર્ષો</b>માં આકાર લે છે. તે પર્યાવરણ અને માનવજીવન સાથે ગાઢ જોડાણ ધરાવે છે.</p>
  <h3>યાદ રાખવા જેવા શબ્દો</h3>
  <ul>
    <li><b>ઊંચાઈ (Altitude):</b> કોઈ વસ્તુ કે સ્થળની સમુદ્રની સપાટીથી ઊંચાઈ.</li>
    <li><b>વૃષ્ટિ (Precipitation):</b> વાતાવરણમાંથી પાણી કોઈપણ સ્વરૂપે જમીન પર પહોંચવું — વરસાદ, બરફ અને કરા.</li>
    <li><b>સમુદ્ર સપાટી (MSL):</b> મહાસાગરોની સપાટીનું સરેરાશ સ્તર.</li>
  </ul>
  <h3>ભૂમિસ્વરૂપોના ત્રણ મુખ્ય પ્રકારો</h3>
  <ol>

    <li>🌾 <b>મેદાનો</b> — વિશાળ, સપાટ અને ફળદ્રુપ</li>
  </ol>
  <div class="note">💡 યાદ રાખો: આ ત્રણેય ભૂમિસ્વરૂપોમાં આબોહવા, વનસ્પતિ અને પ્રાણીસૃષ્ટિ અલગ અલગ હોય છે — અને માનવીએ ત્રણેય સાથે અનુકૂલન સાધ્યું છે.</div>`,
  quiz:[

  content:`
  <h3>પર્વતીય જંગલ (Montane Forest)</h3>
  <p>પર્વતના ઢોળાવ ઘણીવાર એક ખાસ પ્રકારના જંગલથી ઢંકાયેલા હોય છે, જેને <b>પર્વતીય જંગલ</b> કહેવામાં આવે છે. અહીં <b>પાઈન, ફર, સ્પૃસ અને દેવદાર</b> જેવા શંકુદ્રુમ (coniferous) વૃક્ષો સામાન્ય છે.</p>
  <p>આ વૃક્ષો ઊંચાં, શંકુ આકારનાં અને પાતળાં અણીદાર પાંદડાં ધરાવે છે.</p>
  <h3>વધુ ઊંચાઈ પર</h3>
  <p>વધુ ઊંચાઈ પર વૃક્ષોનું સ્થાન <b>ઘાસ, શેવાળ અને લાઈકેન</b> લઈ લે છે.</p>
  <div class="hl">
  🌿 <b>શેવાળ (Moss):</b> ફૂલો કે સાચા મૂળ વિનાનો નાનો લીલો છોડ, જે ઘણીવાર ગાદી જેવા મખમલી આવરણમાં ફેલાય છે.<br>
  🪨 <b>લાઈકેન (Lichen):</b> સામાન્ય રીતે ખડકો, દીવાલો અથવા ઝાડને વળગી રહેતી વનસ્પતિ.
  </div>
  <h3>પર્વતીય પ્રાણીસૃષ્ટિ</h3>
  <p>પર્વતોમાં ગાઢ જંગલો, વહેતી નદીઓ, સરોવર, ઘાસનાં મેદાનો અને ગુફાઓ વિવિધ પ્રાણીઓનું ઘર છે:</p>
  <ul>
    <li>🦅 સોનેરી ગરુડ, પેરેગ્રીન બાજ</li>
    <li>🐆 કેનેડિયન બિલાડી (લિંક્સ), હિમ દિપડો</li>
    <li>🐐 જંગલી બકરીઓ, હિમાલયન તહર</li>
    <li>🐇 પર્વતીય સસલાં, 🐂 યાક</li>
    <li>🦊 રાખોડી શિયાળ, 🐻 કાળું રીંછ</li>
  </ul>
  <h3>કાલિદાસની દૃષ્ટિએ હિમાલય</h3>
  <p>લગભગ ૧૫૦૦ વર્ષ પહેલાંના મહાન કવિ <b>કાલિદાસ</b>નું મહાકાવ્ય <b>‘કુમારસંભવ’</b> હિમાલયની સ્તુતિથી શરૂ થાય છે:</p>
  <div class="note">

  content:`
  <h3>પર્વતીય ભૂભાગની મુશ્કેલી</h3>
  <p>પર્વતીય ભૂભાગ સામાન્ય રીતે <b>ઉબડખાબડ અને ખરબચડો</b> હોય છે તથા તેમાં <b>તીવ્ર ઢોળાવ</b> હોય છે. તેથી નિયમિત ખેતી ફક્ત કેટલીક ખીણોમાં જ શક્ય બને છે.</p>
  <div class="hl">🌾 <b>ટેરેસ ફાર્મિંગ (પગથિયાં આકારની ખેતી):</b> પર્વતના ઢોળાવ પર પગથિયાં જેવાં ખેતરો બનાવીને કરવામાં આવતી ખેતી.</div>
  <p>વિશ્વના ઘણા પર્વતીય દેશોમાં <b>પશુપાલન</b> એ ખેતી કરતાં વધુ પસંદગીનો વ્યવસાય છે.</p>
  <h3>પર્યટન — આવકનું મહત્ત્વનું સાધન</h3>
  <p>સુંદર પર્વતની હવા અને મનોહર સુંદરતા પ્રવાસીઓને આકર્ષે છે. પ્રવાસીઓ સ્કીઈંગ, હાઇકિંગ, પર્વતારોહણ અને પેરાગ્લાઇડિંગ જેવી રમતો માટે પણ પર્વતો પર જાય છે. ઘણી સદીઓથી લોકો પવિત્ર યાત્રાસ્થળો માટે પણ આ ઊંચા ભૂભાગો પર જાય છે. પરંતુ મુલાકાતીઓનો વધુ પડતો ધસારો નાજુક પર્વતીય પારિસ્થિતિકી સંતુલન ખોરવે છે.</p>
  <h3>પ્રેરણાદાયી વ્યક્તિત્વો</h3>
  <div class="note">
  <b>🏅 બચેન્દ્રી પાલ:</b> ખૂબ નાની ઉંમરે પર્વતારોહણ શરૂ કર્યું અને મહિલાઓના અનેક અભિયાનોમાં નેતૃત્વ કર્યું. ૧૯૮૪માં માઉન્ટ એવરેસ્ટ પર ચડનારાં પ્રથમ ભારતીય મહિલા. પદ્મશ્રી (૧૯૮૪) અને પદ્મભૂષણ (૨૦૧૯)થી સન્માનિત.<br><br>
  <b>🏅 અરુણિમા સિંહા:</b> ૩૧ વર્ષની ઉંમરે અકસ્માતમાં એક પગ ગુમાવ્યો. બચેન્દ્રી પાલના પ્રોત્સાહન અને તાલીમથી ૨૦૧૩માં માઉન્ટ એવરેસ્ટ સર કર્યું અને એન્ટાર્કટિકાના માઉન્ટ વિન્સન સહિત દરેક ખંડના સૌથી ઊંચા શિખર પર ચડ્યાં. ૨૦૧૫માં પદ્મશ્રીથી સન્માનિત.
  </div>
  <h3>પર્વતોના પડકારો</h3>
  <ul>
    <li><b>આકસ્મિક પૂર:</b> અચાનક સ્થાનિક પૂર, ઘણીવાર વાદળ ફાટવાને કારણે.</li>
    <li><b>ભૂસ્ખલન:</b> પર્વતીય ક્ષેત્રોમાં ખડકો અને માટીનું તળેટી તરફ અચાનક ધસી આવવું.</li>
    <li><b>હિમસ્ખલન:</b> પર્વત પરથી હિમ, બરફ કે ખડકો અચાનક પડી જવા — ઘણીવાર બરફ ઓગળવા માંડે ત્યારે.</li>
    <li><b>વાદળ ફાટવું:</b> અચાનક પ્રચંડ વરસાદી તોફાન.</li>
  </ul>
  <h3>ખીણ</h3>
  <p><b>ખીણ:</b> ટેકરીઓ અથવા પર્વતોની વચ્ચેનો નીચો, એકંદરે સપાટ વિસ્તાર, જેમાં ઘણીવાર નદી અથવા ઝરણું વહે છે.</p>
  <h3>પવિત્રતાનો ભાવ</h3>
  <p>વિશ્વભરના ઘણા પરંપરાગત સમુદાયો પર્વતોને પવિત્ર સ્થળ માને છે. માઉન્ટ એવરેસ્ટને તિબ્બતી લોકો <b>‘ચોમોલુંગમા’</b> (જગતજનની) અને નેપાળી લોકો <b>‘સાગરમાથા’</b> (આકાશની દેવી) કહે છે. તિબ્બતમાં સ્થિત <b>કૈલાશ પર્વત</b>ને હિંદુ, બૌદ્ધ, જૈન અને બોન ધર્મના અનુયાયીઓ પવિત્ર માને છે.</p>`,
  quiz:[
    {q:"પર્વતીય ઢોળાવ પર પગથિયાં આકારનાં ખેતરો બનાવીને કરવામાં આવતી ખેતીને શું કહે છે?",opts:["ટેરેસ ફાર્મિંગ","ઝૂમિંગ","સિંચાઈ ખેતી","રેખા ખેતી"],a:0},

    {q:"એક પગ ગુમાવ્યા પછી માઉન્ટ એવરેસ્ટ સર કરનારાં કોણ છે?",opts:["બચેન્દ્રી પાલ","અરુણિમા સિંહા","કલ્પના ચાવલા","સંતોષ યાદવ"],a:1},

  <h3>પૂરનાં મેદાનો કેવી રીતે બને છે?</h3>
  <p><b>પૂરનાં મેદાનો</b> એ મેદાનોનો એક પ્રકાર છે, જે પર્વતમાળામાંથી નીકળતી નદીઓ દ્વારા રચાય છે.</p>

  <div class="hl">🌱 પરિણામે આ મેદાનો <b>તમામ પ્રકારના પાક ઉગાડવા માટે આદર્શ</b> છે અને અહીં <b>ખેતી</b> એ મુખ્ય આર્થિક પ્રવૃત્તિ છે. મેદાનો વિવિધ વનસ્પતિ અને પ્રાણીસૃષ્ટિને પોષે છે.</div>
  <h3>યાદ રાખો</h3>
  <p><b>સમુદ્ર સપાટી (Mean Sea Level – MSL):</b> મહાસાગરોની સપાટીનું સરેરાશ સ્તર.</p>
  <h3>ઉપગ્રહ ચિત્રનું અવલોકન</h3>

    <li>સફેદ વિસ્તાર — બરફથી ઢંકાયેલા ઊંચા પર્વતો.</li>
    <li>નીચે ડાબી બાજુનો બદામી વિસ્તાર — ઉચ્ચપ્રદેશ કે શુષ્ક ભૂભાગ.</li>
  </ul>`,
  quiz:[
    {q:"મેદાનોની ઊંચાઈ સામાન્ય રીતે સમુદ્ર સપાટીથી કેટલી હોય છે?",opts:["૩૦૦ મીટરથી વધુ નહીં","૧૫૦૦ મીટરથી વધુ","૪૫૦૦ મીટર","૮૮૪૯ મીટર"],a:0},

  content:`
  <h3>મેદાનોમાં વસ્તી</h3>
  <p>હજારો વર્ષ પહેલાં પ્રારંભિક સભ્યતાઓ નદીઓની આસપાસના ફળદ્રુપ મેદાનોમાં વિકસી હતી. આજે પણ વિશ્વની વસ્તીનો મોટો ભાગ મેદાની વિસ્તારોમાં વસે છે.</p>
  <div class="hl">👥 આશરે <b>૪૦ કરોડ લોકો</b> — ભારતની કુલ વસ્તીના ચોથા ભાગ કરતાં પણ વધુ — ભારતના <b>ગંગાનાં મેદાનો</b>માં વસે છે.</div>
  <h3>મુખ્ય વ્યવસાયો</h3>
  <ul>
    <li>🎣 નદીમાં <b>માછીમારી</b></li>
    <li>🌾 <b>કૃષિ</b> — ડાંગર, ઘઉં, મકાઈ, જવ અને બાજરી</li>
    <li>🧵 રેસાવાળા પાક — કપાસ અને શણ</li>
  </ul>
  <p>પરંપરાગત ખેતી મોટે ભાગે <b>વરસાદ આધારિત</b> હોય છે. તાજેતરના દાયકાઓમાં નહેરો અને ભૂગર્ભ જળ દ્વારા સિંચાઈનું પ્રમાણ વધ્યું છે, જેથી ઉત્પાદન વધ્યું — પરંતુ <b>ભૂગર્ભજળમાં ઘટાડો</b> થયો છે, જે કૃષિના ભવિષ્ય માટે પડકાર છે.</p>
  <h3>મેદાનોની સમસ્યાઓ</h3>

    <li>વધુ પડતી વસતી</li>
    <li>પ્રદૂષણ</li>
    <li>ભૂગર્ભજળનો ઘટાડો</li>

  <h3>નદી અને સંસ્કૃતિ</h3>
  <div class="hl">🔑 <b>સંગમ (Confluence):</b> બે કે તેથી વધુ નદીઓનું મિલન બિંદુ.</div>
  <p>પર્વતોની હારમાળા હોય કે મેદાનો — વિશ્વભરમાં નદીઓએ પુષ્કળ સાંસ્કૃતિક મૂલ્યોનું વહન કર્યું છે. ઘણા સમુદાયો નદીના <b>ઉદ્ગમ</b> અને <b>સંગમ</b>ને પવિત્ર માને છે. ભારતમાં આવાં સ્થળોએ અસંખ્ય તહેવારો, મેળા અને ધાર્મિક વિધિઓનું આયોજન થાય છે.</p>
  <h3>વહાણવટું</h3>
  <p>મેદાનોમાં સામાન્ય ઢોળાવ હોવાને કારણે નદીમાં <b>વહાણવટું સરળ</b> બને છે. પહેલાંના સમયમાં લોકો એક સ્થળેથી બીજી જગ્યાએ જવા માટે નદીઓના જળમાર્ગનો મોટા પ્રમાણમાં ઉપયોગ કરતા હતા. આજે પણ ગંગા કિનારે લોકો હરવા-ફરવા માટે હોડીઓનો ઉપયોગ કરવાનું પસંદ કરે છે.</p>
  <h3>ગંગા વિશે</h3>
  <p>ગંગા હિમાલયમાંથી ઉદ્ગમ પામતી સૌથી મોટી ભારતીય નદી છે (અંગ્રેજીમાં Ganges). લગભગ <b>૨૫૦૦ કિમી</b> લાંબી આ નદીમાં અસંખ્ય ઉપનદીઓ મળે છે. યમુના અને ઘાઘરા હિમાલયમાંથી નીકળે છે, જ્યારે સોન (શોણ) ગંગાના મેદાનની દક્ષિણે વિંધ્ય પર્વતમાળામાંથી ઉદ્ભવે છે.</p>`,

const quizBank = {};
lessons.forEach(l => quizBank["L"+l.n] = l.quiz);
quizBank["UNIT"] = unitTest;

const app = document.getElementById('app');
const nav = document.getElementById('lessonNav');

function buildNav(){
  let h = '';
  lessons.forEach(l=>{
    h += '<button class="chip" data-nav="'+l.n+'" onclick="openLesson('+l.n+')">'+l.emoji+' તાસ '+l.n+'</button>';
  });
  h += '<button class="chip" data-nav="0" onclick="openUnitTest()">📝 એકમ ટેસ્ટ</button>';
  nav.innerHTML = h;
}
function setActive(n){
  nav.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.nav === String(n));
  });
}

   + '<div class="planItem"><h4>🎯 શીખ્યતા પરિણામ</h4><p>'+l.plan.lo+'</p></div>'
   + '<div class="planItem"><h4>🧩 મુખ્ય પ્રવૃત્તિ</h4><p>'+l.plan.act+'</p></div>'
   + '<div class="planItem"><h4>🧰 સામગ્રી</h4><p>'+l.plan.mat+'</p></div>'
   + '<div class="planItem"><h4>📊 મૂલ્યાંકન</h4><p>'+l.plan.eval+'</p></div>'
   + '<div class="planItem remedial"><h4>🩹 ઉપચારાત્મક કાર્ય</h4><p>'+l.plan.remedial+'</p></div>'
   + '<div class="planItem reeval"><h4>🔁 પુનઃ મૂલ્યાંકન</h4><p>'+l.plan.reeval+'</p></div>'

/* --- મીડિયા HTML --- */
function mediaHTML(l){
  if(!l.media) return '<div class="note">આ તાસ માટે મીડિયા ઉપલબ્ધ નથી.</div>';
  let h = '<div class="mediaSection">';
  if(l.media.images && l.media.images.length){
    h += '<h3>🖼️ ચિત્રો</h3><div class="imgGrid">';
    l.media.images.forEach(function(img){
      h += '<figure class="imgCard">';
      if(img.src){
        h += '<img src="'+img.src+'" alt="'+(img.caption||'')+'" loading="lazy">';
      } else {
        h += '<div class="imgPlaceholder"><span class="phIcon">'+(img.icon||'🖼️')+'</span><span class="phText">ચિત્ર ઉમેરો</span><span class="phHint">img.src માં ઇમેજ URL મૂકો</span></div>';
      }
      if(img.caption) h += '<figcaption>'+img.caption+'</figcaption>';
      h += '</figure>';
    });
    h += '</div>';
  }
  if(l.media.videos && l.media.videos.length){
    h += '<h3>🎬 વિડિયો</h3><div class="vidGrid">';
    l.media.videos.forEach(function(v){
      h += '<figure class="vidCard">';
      if(v.type === 'youtube' && v.src){
        h += '<div class="vidFrame"><iframe src="https://www.youtube.com/embed/'+v.src+'" allowfullscreen loading="lazy" title="video"></iframe></div>';
      } else if(v.type === 'mp4' && v.src){
        h += '<video controls preload="none"><source src="'+v.src+'" type="video/mp4"></video>';
      } else {
        h += '<div class="vidPlaceholder"><span class="phIcon">🎬</span><span class="phText">વિડિયો લિંક ઉમેરો</span><span class="phHint">YouTube ID અથવા MP4 URL</span></div>';
      }
      if(v.caption) h += '<figcaption>'+v.caption+'</figcaption>';
      h += '</figure>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* --- ક્વિઝ HTML --- */
function quizHTML(id, qs, title){
  let h = '<div class="quizBox">';
  h += '<p class="quizTitle">'+title+'</p>';
  qs.forEach(function(item,i){
    h += '<div class="qItem" id="q-'+id+'-'+i+'">';
    h += '<p class="qText"><span class="qNum">'+(i+1)+'</span><span>'+item.q+'</span></p><div class="opts">';
    item.opts.forEach(function(o,j){
      h += '<label class="opt"><input type="radio" name="'+id+'-'+i+'" value="'+j+'"><span>'+o+'</span></label>';
    });
    h += '</div><p class="feedback" id="fb-'+id+'-'+i+'"></p></div>';
  });
  h += '<div class="tabs">'
     + '<button class="btn primary" onclick="checkQuiz(\''+id+'\')">✅ જવાબ ચકાસો</button>'
     + '<button class="btn secondary" onclick="resetQuiz(\''+id+'\')">🔄 ફરી પ્રયત્ન</button>'
     + '</div><div id="score-'+id+'"></div></div>';
  return h;
}

function checkQuiz(id){
  const qs = quizBank[id];
  let correct = 0;
  qs.forEach(function(item,i){
    const sel = document.querySelector('input[name="'+id+'-'+i+'"]:checked');
    const fb  = document.getElementById('fb-'+id+'-'+i);
    const labels = document.querySelectorAll('#q-'+id+'-'+i+' .opt');
    labels.forEach(function(lb){ lb.classList.remove('correct','wrong'); });
    labels[item.a].classList.add('correct');
    if(sel){
      const v = Number(sel.value);
      if(v === item.a){
        correct++;
        fb.className = 'feedback ok';
        fb.textContent = '✅ સાચો જવાબ!';
      } else {
        labels[v].classList.add('wrong');
        fb.className = 'feedback bad';
        fb.textContent = '❌ ખોટો જવાબ — સાચો જવાબ: (' + 'abcd'[item.a] + ') ' + item.opts[item.a];
      }
    } else {
      fb.className = 'feedback warn';
      fb.textContent = '⚠️ જવાબ આપ્યો નથી — સાચો જવાબ: (' + 'abcd'[item.a] + ') ' + item.opts[item.a];
    }
  });
  const total = qs.length;
  const pct = Math.round(correct/total*100);
  let msg = '👍 સારો પ્રયત્ન! વધુ સરસ કરી શકાય.';
  if(pct === 100) msg = '🎉 ઉત્તમ! બધા જવાબ સાચા!';
  else if(pct >= 80) msg = '🌟 ખૂબ સરસ! લગભગ બધું જ સમજાયું છે.';
  else if(pct >= 50) msg = '🙂 ઠીક છે — થોડું વધુ પુનરાવર્તન કરો.';
  const box = document.getElementById('score-'+id);
  box.innerHTML = '<div class="scoreCard">તમારો સ્કોર: <b>'+correct+'/'+total+'</b> ('+pct+'%)<br><span style="font-size:15px;font-weight:600">'+msg+'</span></div>';
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

function resetQuiz(id){
  const qs = quizBank[id];
  qs.forEach(function(item,i){
    document.querySelectorAll('input[name="'+id+'-'+i+'"]').forEach(function(r){ r.checked = false; });
    document.querySelectorAll('#q-'+id+'-'+i+' .opt').forEach(function(lb){
      lb.classList.remove('correct','wrong');
    });
    const fb = document.getElementById('fb-'+id+'-'+i);
    fb.className = 'feedback'; fb.textContent = '';
  });
  document.getElementById('score-'+id).innerHTML = '';
  document.getElementById('q-'+id+'-0').scrollIntoView({behavior:'smooth', block:'center'});
}

function showPanel(n, which, btn){
  ['plan','content','media','quiz'].forEach(function(w){
    const p = document.getElementById('panel-'+w+'-'+n);
    if(p) p.classList.toggle('show', w === which);
  });
  if(btn){
    btn.parentElement.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  }
}

function openLesson(n){
  const l = lessons.find(function(x){ return x.n === n; });
  setActive(n);
  app.innerHTML =
    '<div class="lessonCard">'
    + '<h2>'+l.emoji+' તાસ '+l.n+': '+l.title+'</h2>'
    + '<p class="sub">'+l.sub+'</p>'
    + '<div class="tabs">'
    +   '<button class="btn primary tab-btn" onclick="showPanel('+n+',\'plan\',this)">👩‍🏫 શિક્ષક આયોજન</button>'
    +   '<button class="btn secondary tab-btn" onclick="showPanel('+n+',\'content\',this)">📖 વિદ્યાર્થી સામગ્રી</button>'
    +   '<button class="btn secondary tab-btn" onclick="showPanel('+n+',\'media\',this)">🖼️ મીડિયા</button>'
    +   '<button class="btn accent tab-btn" onclick="showPanel('+n+',\'quiz\',this)">⏱ ૫ મિનિટ ટેસ્ટ</button>'
    +   '<button class="btn secondary" onclick="printPlan('+n+')">🖨 પ્લાન પ્રિન્ટ</button>'
    + '</div>'
    + '<div class="panel" id="panel-plan-'+n+'">'+planHTML(l)+'</div>'
    + '<div class="panel" id="panel-content-'+n+'"><div class="content">'+l.content+'</div></div>'
    + '<div class="panel" id="panel-media-'+n+'">'+mediaHTML(l)+'</div>'
    + '<div class="panel" id="panel-quiz-'+n+'">'+quizHTML('L'+n, l.quiz, '⏱ ૫ મિનિટનો ટેસ્ટ — તાસ '+n)+'</div>'
    + '</div>';
  const contentBtn = app.querySelectorAll('.tab-btn')[1];
  showPanel(n, 'content', contentBtn);
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildPaperHTML(title, qs, showAns){
  let h = '<div class="pHead">';
  h += '<h1>'+title+'</h1>';
  h += '<p>ધોરણ ૬ • સામાજિક વિજ્ઞાન • એકમ: ભૂમિસ્વરૂપો અને જીવન</p>';
  h += '<p class="pInfo">નામ: ______________________ &nbsp;&nbsp; રોલ નં: ______ &nbsp;&nbsp; તારીખ: __________ &nbsp;&nbsp; ગુણ: ____/'+qs.length+'</p>';
  h += '</div><ol class="pList">';
  qs.forEach(function(q){
    h += '<li><div class="pq">'+q.q+'</div><div class="popts">';
    q.opts.forEach(function(o,j){
      const mark = (showAns && j === q.a) ? ' ✔' : '';
      h += '<span class="po">(' + 'abcd'[j] + ') ' + o + mark + '</span>';
    });
    h += '</div></li>';
  });
  h += '</ol>';
  if(showAns){
    h += '<p class="pAns">ઉત્તર સૂચિ: ' + qs.map(function(q,i){ return (i+1) + '-' + 'abcd'[q.a]; }).join(',  ') + '</p>';
  }
  return h;
}
